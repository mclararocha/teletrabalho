<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROMOVE – Teletrabalho · Desligamentos da unidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/promove.css">
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/navigation.js"></script>
<style>
.back{margin-bottom:18px}
</style>
</head>
<body>
<div class="app-shell">
<aside id="sidebar" class="sidebar"></aside>
<div class="wrap">

  <div class="nav-top">
    <a href="../index.html" class="nav-back">← Painel de telas</a>
    <div id="seletor-perfil"></div>
  </div>

  <div class="back"><a class="btn sm" href="06_-_Teletrabalho_-_Painel_Setorial.html">← Painel da unidade setorial</a></div>

  <div class="eyebrow">Promove – teletrabalho</div>
  <h1>Desligamentos da unidade</h1>
  <p class="sub" id="tela08-sub">Nenhuma unidade selecionada</p>

  <div class="section" style="margin-top:28px">
    <div class="section-title">Desligamentos no ciclo</div>
    <p class="section-meta" id="tela08-meta">O retorno às atividades presenciais ocorre no primeiro dia útil subsequente ao desligamento.</p>

    <div class="card" id="tela08-lista"></div>
  </div>

  <div class="btn-row right">
    <button>Exportar relação</button>
  </div>

</div>
</div>
<script>
document.addEventListener('click', function (e) {
  var h = e.target.closest('.acc-h');
  if (h) h.parentElement.classList.toggle('col');
});

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var dados = PromoveStore.dados();
  var lista = $("tela08-lista");

  if (!dados) {
    lista.innerHTML = '<div class="vazio">Nenhum desligamento registrado nesta unidade.</div>';
    return;
  }

  var t = dados.tela08;
  $("tela08-sub").textContent = t.unidade + " · " + t.orgao + " · titular " + t.titular;
  $("tela08-meta").textContent = t.desligamentos.length + " desligamentos nas hipóteses do art. 23 da minuta. O retorno às atividades presenciais ocorre no primeiro dia útil subsequente ao desligamento.";

  lista.innerHTML = t.desligamentos.map(function (d, i) {
    var kvs = '<div class="kv"><span class="k">Fundamento:</span><span class="v">' + d.fundamento + '</span></div>';
    if (d.planoAvaliado) kvs += '<div class="kv"><span class="k">Plano avaliado:</span><span class="v">' + d.planoAvaliado + '</span></div>';
    kvs += '<div class="kv"><span class="k">Ato de desligamento:</span><span class="v">' + d.ato + '</span></div>';
    kvs += '<div class="kv"><span class="k">Data do desligamento:</span><span class="v">' + d.data + '</span></div>';
    kvs += '<div class="kv"><span class="k">Retorno ao presencial:</span><span class="v">' + d.retorno + '</span></div>';
    if (d.ciencia) kvs += '<div class="kv"><span class="k">Ciência do servidor:</span><span class="v">' + d.ciencia + '</span></div>';
    return '<div class="acc' + (i > 0 ? ' col' : '') + '"><button class="acc-h"><div class="acc-h-in">' +
      '<span class="acc-name"><span class="chev">▾</span>' + d.nome + '</span>' +
      '<span class="chip chip-' + d.chipClasse + '">' + d.tipoChip + '</span></div></button>' +
      '<div class="acc-b">' + kvs + '</div></div>';
  }).join("");
})();
</script>
<script>PromoveNav.init({ atual: "08", raiz: "" });</script>
</body>
</html>
