<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROMOVE – Teletrabalho · Pactuação do plano de trabalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/promove.css">
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/navigation.js"></script>
<style>
.roles{display:flex;gap:8px;align-items:center}
.roles-lbl{font-size:12.5px;color:var(--muted)}
.role-btn.on{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}

.ent-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ent-prio{font-size:12.5px;color:var(--muted)}
.ent-log{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.6}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.ent-acts{display:flex;gap:10px;margin:12px 0 0;flex-wrap:wrap}

.kv input[type=text],.kv select{width:auto}

.removed{padding:16px 20px;background:var(--soft);border-radius:14px;margin-bottom:28px}
.removed .t{font-size:13.5px;font-weight:600;margin-bottom:4px}
.removed .d{font-size:13.5px;color:var(--muted);line-height:1.6}

.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.foot .tacit{font-size:12.5px;color:var(--muted);flex:1;min-width:220px;text-align:right}
</style>
</head>
<body id="pk" class="rc">
<div class="app-shell">
<aside id="sidebar" class="sidebar"></aside>
<div class="wrap">

  <div class="nav-top">
    <a href="../index.html" class="nav-back">← Painel de telas</a>
    <div id="seletor-perfil"></div>
  </div>

  <div class="head">
    <div>
      <div class="eyebrow">Promove – teletrabalho</div>
      <h1>Pactuação do plano de trabalho</h1>
      <p class="sub">Proposta do servidor, validação da chefia imediata e aceite do plano</p>
    </div>
    <div class="roles">
      <span class="roles-lbl">Visão</span>
      <button class="role-btn" id="bs">Servidor</button>
      <button class="role-btn on" id="bc">Chefia</button>
    </div>
  </div>

  <div class="card ident" id="tela03-ident"></div>

  <div class="section">
    <div class="card card-pad" id="tela03-vigencia"></div>
  </div>

  <div id="tela03-entregas"></div>

  <div class="removed" id="tela03-removida"></div>

  <div class="foot oc">
    <button>Acrescentar entrega</button>
    <span style="display:flex;gap:10px;flex-wrap:wrap">
      <button>Devolver ao servidor</button>
      <button>Validar plano de trabalho</button>
    </span>
  </div>

  <div class="foot os">
    <button>Acrescentar entrega</button>
    <span class="tacit">Sem manifestação até 04/11/2026, o aceite é considerado tácito.</span>
    <button>Aceitar plano de trabalho</button>
  </div>

</div>
</div>

<script>
document.addEventListener('click', function (e) {
  var h = e.target.closest('.acc-h');
  if (h) h.parentElement.classList.toggle('col');
});
var pk = document.getElementById('pk');
var bs = document.getElementById('bs');
var bc = document.getElementById('bc');
function setRole(r){
  pk.className = r;
  bs.classList.toggle('on', r === 'rs');
  bc.classList.toggle('on', r === 'rc');
}
bs.addEventListener('click', function(){ setRole('rs'); });
bc.addEventListener('click', function(){ setRole('rc'); });

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var dados = PromoveStore.dados();
  var entregasEl = $("tela03-entregas");
  var removida = $("tela03-removida");

  if (!dados) {
    $("tela03-ident").innerHTML = '<div class="vazio">Nenhum plano de trabalho em pactuação.</div>';
    $("tela03-vigencia").innerHTML = '<div class="vazio">Nenhuma proposta enviada.</div>';
    entregasEl.innerHTML = '<div class="section"><div class="card card-pad"><div class="vazio">' +
      'Nenhuma entrega proposta. Clique em "Acrescentar entrega" para começar.</div></div></div>';
    removida.hidden = true;
    return;
  }

  var s = dados.servidor;
  var t = dados.tela03;

  $("tela03-ident").innerHTML =
    '<div class="ident-grid">' +
    '<div class="ident-item"><div class="lbl">Nome</div><div class="val">' + s.nome + '</div></div>' +
    '<div class="ident-item"><div class="lbl">CPF</div><div class="val">' + s.cpf + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Código do vínculo</div><div class="val">' + s.vinculo + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Cargo efetivo</div><div class="val">' + s.cargo + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Órgão de origem</div><div class="val">' + s.orgaoOrigem + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Órgão de lotação</div><div class="val">' + s.orgaoLotacao + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Unidade administrativa</div><div class="val">' + s.unidade + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Chefia imediata</div><div class="val">' + s.chefiaImediata + '</div></div>' +
    '</div>';

  $("tela03-vigencia").innerHTML =
    '<div class="kv"><span class="k">Vigência do plano:</span><span class="v">' + t.vigenciaPlano + '</span></div>' +
    kvDual("Regime:", '<select><option>Selecionar</option><option>Teletrabalho parcial</option><option>Presencial integral</option></select>', t.regime, false) +
    kvDual("Comparecimento presencial:", '<select><option>Selecionar</option><option>2 dias por semana</option><option>1 dia por semana</option><option>Quinzenal</option></select>', t.comparecimentoPresencial, false) +
    '<div class="kv"><span class="k">Controle de jornada:</span><span class="calc">Cumprimento do plano de trabalho, aferido por relatório semanal de entregas</span></div>' +
    '<div class="kv"><span class="k">Situação:</span><span class="calc">' + t.situacao + '</span></div>';

  function kvDual(label, editHtml, valorTexto, reversedRoles, extraCalc, readonlyClass) {
    var editSpan = '<span class="' + (reversedRoles ? "os" : "oc") + '">' + editHtml + '</span>';
    var valSpan = '<span class="' + (reversedRoles ? "oc" : "os") + ' ' + (readonlyClass || "v") + '">' + valorTexto + '</span>';
    return '<div class="kv"><span class="k">' + label + '</span>' + editSpan + valSpan + (extraCalc ? '<span class="calc">' + extraCalc + '</span>' : '') + '</div>';
  }

  function botoes(lista) {
    return lista.map(function (l) { return '<button class="sm">' + l + '</button>'; }).join("");
  }

  function renderAtividade(a, reversedRoles, aberta) {
    var regimeSel = '<select><option>Selecionar</option><option>Teletrabalho</option><option>Presencial</option></select>';
    var impactoSel = '<select><option>Selecionar</option><option>Baixo</option><option>Médio</option><option>Alto</option></select>';
    var dificuldadeSel = '<select><option>Selecionar</option><option>Baixa</option><option>Média</option><option>Alta</option></select>';

    var v = function (texto) { return '<span class="v">' + texto + '</span>'; };
    var kvs = '<div class="kv"><span class="k">Origem:</span><span class="calc">' + a.origem + '</span></div>';
    kvs += '<div class="kv"><span class="k">Tipo de atividade:</span><span class="calc">' + a.tipoAtividade + '</span></div>';

    if (a.finalizada) {
      kvs += '<div class="kv"><span class="k">Regime de execução:</span>' + v(a.regime) + '</div>';
      kvs += '<div class="kv"><span class="k">Início pactuado:</span>' + v(a.inicioPactuado) + '</div>';
      kvs += '<div class="kv"><span class="k">Conclusão pactuada:</span>' + v(a.conclusaoPactuada) + '</div>';
      kvs += '<div class="kv"><span class="k">Quantidade pactuada:</span>' + v(a.qtdPactuada + " " + a.unidadeQtd) + '</div>';
      kvs += '<div class="kv"><span class="k">Referência presencial:</span><span class="calc">' + a.referenciaPresencial + '</span></div>';
      kvs += '<div class="kv"><span class="k">Impacto:</span>' + v(a.impacto) + '</div>';
      kvs += '<div class="kv"><span class="k">Dificuldade:</span>' + v(a.dificuldade) + '</div>';
      kvs += '<div class="kv"><span class="k">Nível de complexidade:</span><span class="calc">' + a.nivelComplexidade + ' · InCp ' + a.incp + '</span></div>';
    } else {
      kvs += kvDual("Regime de execução:", regimeSel, a.regime, reversedRoles);
      kvs += kvDual("Início pactuado:", '<input type="text" placeholder="' + a.inicioPactuado + '" size="18">', a.inicioPactuado, reversedRoles);
      kvs += kvDual("Conclusão pactuada:", '<input type="text" placeholder="' + a.conclusaoPactuada + '" size="18">', a.conclusaoPactuada, reversedRoles);
      kvs += kvDual("Quantidade pactuada:", '<input type="text" placeholder="' + a.qtdPactuada + '" size="5">', a.qtdPactuada, reversedRoles, a.unidadeQtd);
      kvs += '<div class="kv"><span class="k">Referência presencial:</span><span class="calc">' + a.referenciaPresencial + '</span></div>';
      if (a.pendenteDefinicaoChefia) {
        if (reversedRoles) {
          kvs += '<div class="kv"><span class="k">Impacto:</span><span class="calc">A definir pela chefia</span></div>';
          kvs += '<div class="kv"><span class="k">Dificuldade:</span><span class="calc">A definir pela chefia</span></div>';
        } else {
          kvs += kvDual("Impacto:", impactoSel, "A definir pela chefia", reversedRoles, null, "calc");
          kvs += kvDual("Dificuldade:", dificuldadeSel, "A definir pela chefia", reversedRoles, null, "calc");
        }
        kvs += '<div class="kv"><span class="k">Nível de complexidade:</span><span class="calc">Pendente de impacto e dificuldade</span></div>';
      } else {
        kvs += kvDual("Impacto:", impactoSel, a.impacto, reversedRoles);
        kvs += kvDual("Dificuldade:", dificuldadeSel, a.dificuldade, reversedRoles);
        kvs += '<div class="kv"><span class="k">Nível de complexidade:</span><span class="calc">' + a.nivelComplexidade + ' · InCp ' + a.incp + '</span></div>';
      }
    }
    if (a.log) kvs += '<div class="log">' + a.log + '</div>';
    if (a.actsOs) kvs += '<div class="acts os">' + botoes(a.actsOs) + '</div>';
    if (a.actsOc) kvs += '<div class="acts oc">' + botoes(a.actsOc) + '</div>';
    else if (a.actsOcCalc) kvs += '<div class="acts oc"><span class="calc">' + a.actsOcCalc + '</span></div>';

    return '<div class="acc' + (aberta ? '' : ' col') + '"><button class="acc-h"><div class="acc-h-in">' +
      '<span class="acc-name"><span class="chev">▾</span>' + a.nome + '</span>' +
      '<span class="chip chip-' + a.chipClasse + '">' + a.statusChip + '</span></div></button>' +
      '<div class="acc-b">' + kvs + '</div></div>';
  }

  entregasEl.innerHTML = t.entregas.map(function (ent, ei) {
    var atividades = ent.atividades.map(function (a, ai) {
      return renderAtividade(a, !!ent.reversedRoles, ei === 0 && ai === 0);
    }).join("");
    var addrow = ent.reversedRoles
      ? '<div class="addrow os"><button class="sm">Acrescentar atividade a esta entrega</button></div>'
      : '<div class="addrow"><button class="sm">Acrescentar atividade a esta entrega</button></div>';
    var entHead = '<div class="ent-head"><span class="ent-prio">Prioridade da entrega</span>';
    if (ent.prioridade) {
      var prioritySelect = '<select><option>Selecionar</option><option>1 — muito alta</option><option>2 — alta</option>' +
        '<option>3 — média</option><option>4 — baixa</option></select>';
      entHead += '<span class="' + (ent.reversedRoles ? "os" : "oc") + '">' + prioritySelect + '</span>';
      entHead += '<span class="' + (ent.reversedRoles ? "oc" : "os") + ' v" style="font-size:13.5px">' + ent.prioridade + '</span>';
    } else {
      entHead += '<span class="calc" style="font-size:13.5px">A definir pela chefia</span>';
    }
    if (ent.chipClasse) entHead += '<span class="chip chip-' + ent.chipClasse + '">' + (ent.rascunhoDoServidor ? "Rascunho do servidor" : "Alterada pela chefia") + '</span>';
    entHead += '</div>';
    var entLog = ent.log && (ent.alteradaPelaChefia || ent.rascunhoDoServidor) ? '<div class="ent-log">' + ent.log + '</div>' : '';
    var entActs = ent.entActsOs ? '<div class="ent-acts os">' + botoes(ent.entActsOs) + '</div>' : '';
    return '<div class="section">' +
      '<div class="section-title">Entrega ' + (ei + 1) + ' · ' + ent.nome + '</div>' +
      entHead + entLog +
      '<div class="card">' + atividades + addrow + '</div>' +
      entActs + '</div>';
  }).join("");

  if (t.atividadeExcluida) {
    removida.hidden = false;
    removida.innerHTML =
      '<div class="t">Atividade excluída do plano</div>' +
      '<div class="d">' + t.atividadeExcluida.nome + ' — ' + t.atividadeExcluida.detalhe + '</div>';
  } else {
    removida.hidden = true;
  }
})();
</script>
<script>PromoveNav.init({ atual: "03", raiz: "" });</script>
</body>
</html>
