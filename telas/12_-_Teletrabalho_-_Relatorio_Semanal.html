<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROMOVE – Teletrabalho · Relatório semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/promove.css">
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/navigation.js"></script>
<style>
.back{margin-bottom:18px}
.row{display:flex;align-items:center;gap:14px;padding:13px 18px}
.row + .row{border-top:1px solid var(--line)}
.row .t{font-size:13.5px}
.row .d{font-size:12.5px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div class="app-shell">
<aside id="sidebar" class="sidebar"></aside>
<div class="wrap">

  <div class="nav-top">
    <a href="../index.html" class="nav-back">← Painel de telas</a>
    <div id="seletor-perfil"></div>
  </div>

  <div class="back"><a class="btn sm" href="04_-_Teletrabalho_-_Servidor.html">← Meu plano de trabalho</a></div>

  <div class="head">
    <div>
      <div class="eyebrow">Promove – teletrabalho</div>
      <h1>Relatório semanal</h1>
      <p class="sub" id="tela12-sub">Nenhum relatório disponível</p>
    </div>
    <span class="chip chip-amber" id="tela12-status" hidden></span>
  </div>

  <p class="section-meta">Montado automaticamente pelo sistema a partir das evidências registradas e do comparecimento presencial da semana.</p>

  <div class="metrics" id="tela12-metrics"></div>

  <div class="section">
    <div class="section-title">Atividades com movimentação na semana</div>
    <div class="card" id="tela12-atividades"></div>
  </div>

  <div class="section">
    <div class="section-title">Comparecimento presencial</div>
    <div class="card" id="tela12-comparecimento"></div>
  </div>

  <div class="btn-row right">
    <button>Salvar rascunho</button>
    <button>Submeter relatório semanal</button>
  </div>

</div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var dados = PromoveStore.dados();
  var metrics = $("tela12-metrics");
  var atividades = $("tela12-atividades");
  var comparecimento = $("tela12-comparecimento");

  if (!dados) {
    metrics.innerHTML =
      '<div class="metric"><div class="lbl">Atividades com evidência</div><div class="num">0</div></div>' +
      '<div class="metric"><div class="lbl">Atividades sem evidência</div><div class="num">0</div></div>' +
      '<div class="metric"><div class="lbl">Dias de comparecimento presencial</div><div class="num">0</div></div>';
    atividades.innerHTML = '<div class="vazio">Nenhuma atividade com movimentação nesta semana.</div>';
    comparecimento.innerHTML = '<div class="vazio">Nenhum comparecimento presencial registrado nesta semana.</div>';
    return;
  }

  var t = dados.tela12;
  $("tela12-sub").textContent = t.semana;
  var status = $("tela12-status");
  status.textContent = t.statusChip;
  status.hidden = false;

  metrics.innerHTML =
    '<div class="metric"><div class="lbl">Atividades com evidência</div><div class="num">' + t.metricas.comEvidencia + '</div></div>' +
    '<div class="metric"><div class="lbl">Atividades sem evidência</div><div class="num warn">' + t.metricas.semEvidencia + '</div></div>' +
    '<div class="metric"><div class="lbl">Dias de comparecimento presencial</div><div class="num">' + t.metricas.comparecimento + '</div></div>';

  atividades.innerHTML = t.atividades.map(function (a) {
    return '<div class="row"><div style="flex:1;min-width:0"><div class="t">' + a.nome + '</div>' +
      '<div class="d">' + a.detalhe + '</div></div>' +
      '<span class="chip chip-' + a.chipClasse + '">' + a.statusChip + '</span></div>';
  }).join("");

  comparecimento.innerHTML = t.comparecimento.map(function (c) {
    return '<div class="row"><div style="flex:1;min-width:0"><div class="t">' + c.dia + '</div>' +
      '<div class="d">' + c.horario + '</div></div>' +
      '<span class="chip chip-green">' + c.statusChip + '</span></div>';
  }).join("");
})();
</script>
<script>PromoveNav.init({ atual: "12", raiz: "" });</script>
</body>
</html>
