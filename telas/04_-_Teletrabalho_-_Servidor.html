<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROMOVE – Teletrabalho · Plano de trabalho do servidor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/promove.css">
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/navigation.js"></script>
<style>
.head-chips{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

.weeks{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-bottom:14px}
.week{text-align:center;padding:10px 2px;border-radius:10px;border:1px solid transparent}
.week .lbl{font-size:11px;font-weight:600;margin-bottom:2px}
.week .st{font-size:14px;font-weight:700}
.week-done{background:var(--green-bg);color:var(--green)}
.week-open{background:var(--amber-bg);color:var(--amber)}
.week-next{border-color:var(--line);color:var(--faint)}

.now{background:var(--soft);border-radius:14px;padding:18px 20px}
.now-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.now-title{font-size:15px;font-weight:600}
.btn-row{margin-top:14px}

.list{overflow:hidden}
.ent + .ent{border-top:1px solid var(--line)}
.ent-h{width:100%;background:none;border:none;border-radius:0;text-align:left;display:block;cursor:pointer;
       font-weight:400;color:inherit;padding:16px 20px}
.ent-h:hover{background:var(--soft)}
.ent-h-in{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.ent-name{font-size:15.5px;font-weight:600}
.ent-meta{font-size:12.5px;color:var(--muted);margin-top:3px;padding-left:22px}
.ent-b{padding:0 20px 12px 10px}
.ent.col .ent-b{display:none}
.ent.col > .ent-h .chev{transform:rotate(-90deg)}

.st-done{font-size:12.5px;font-weight:600;color:var(--green);white-space:nowrap}
.st-warn{font-size:12.5px;font-weight:600;color:var(--amber);white-space:nowrap}

.kv input[type=text]{width:auto}

@media(max-width:640px){
  .weeks{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>
<div class="app-shell">
<aside id="sidebar" class="sidebar"></aside>
<div class="wrap">

  <div class="nav-top">
    <a href="../index.html" class="nav-back">← Painel de telas</a>
    <div id="seletor-perfil"></div>
  </div>

  <div class="head">
    <div>
      <div class="eyebrow">Promove – teletrabalho</div>
      <h1>Meu plano de trabalho</h1>
      <p class="sub">Acompanhamento das entregas, atividades e relatórios semanais</p>
    </div>
    <div class="head-chips" id="tela04-chips"></div>
  </div>

  <div class="card ident" id="tela04-ident"></div>

  <div class="section">
    <div class="section-title">Relatórios semanais</div>
    <div class="weeks" id="tela04-weeks"></div>

    <div class="now" id="tela04-now"></div>
  </div>

  <div class="section">
    <div class="section-title">Entregas e atividades</div>
    <div class="card list" id="tela04-entregas"></div>

    <div class="btn-row">
      <a class="btn" href="13_-_Teletrabalho_-_Repactuacao.html">Solicitar ajuste do plano de trabalho</a>
      <button>Consultar histórico de relatórios</button>
    </div>
  </div>

</div>
</div>

<script>
document.addEventListener('click', function (e) {
  var accH = e.target.closest('.acc-h');
  if (accH) { accH.parentElement.classList.toggle('col'); return; }
  var entH = e.target.closest('.ent-h');
  if (entH) entH.parentElement.classList.toggle('col');
});

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var dados = PromoveStore.dados();
  var entregasEl = $("tela04-entregas");

  if (!dados) {
    $("tela04-chips").innerHTML = "";
    $("tela04-ident").innerHTML = '<div class="vazio">Nenhum plano de trabalho vigente.</div>';
    $("tela04-weeks").innerHTML = "";
    $("tela04-now").innerHTML = '<div class="vazio">Nenhuma semana em aberto.</div>';
    entregasEl.innerHTML = '<div class="vazio">Nenhuma entrega pactuada.'
      + '<div class="btn-row"><a class="btn sm" href="03_-_Teletrabalho_-_Pactuacao.html">Ir para a pactuação do plano de trabalho</a></div></div>';
    return;
  }

  var s = dados.servidor;
  var t = dados.tela04;

  $("tela04-chips").innerHTML =
    '<span class="chip chip-blue">Vigência ' + t.vigencia + '</span>' +
    '<span class="chip chip-green">' + s.regime + '</span>';

  $("tela04-ident").innerHTML =
    '<div class="ident-grid">' +
    '<div class="ident-item"><div class="lbl">Nome</div><div class="val">' + s.nome + '</div></div>' +
    '<div class="ident-item"><div class="lbl">CPF</div><div class="val">' + s.cpf + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Código do vínculo</div><div class="val">' + s.vinculo + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Cargo efetivo</div><div class="val">' + s.cargo + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Órgão de origem</div><div class="val">' + s.orgaoOrigem + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Órgão de lotação</div><div class="val">' + s.orgaoLotacao + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Unidade administrativa</div><div class="val">' + s.unidade + '</div></div>' +
    '<div class="ident-item"><div class="lbl">Chefia imediata</div><div class="val">' + s.chefiaImediata + '</div></div>' +
    '</div>';

  var STATUS_ICON = { done: "✓", open: "•••", next: "·" };
  $("tela04-weeks").innerHTML = t.semanas.map(function (w) {
    return '<div class="week week-' + w.status + '"><div class="lbl">' + w.rotulo + '</div><div class="st">' + STATUS_ICON[w.status] + '</div></div>';
  }).join("");

  $("tela04-now").innerHTML =
    '<div class="now-top"><div class="now-title">' + t.semanaAtual.rotulo + '</div>' +
    '<span class="chip chip-amber">Prazo de submissão: ' + t.semanaAtual.prazoSubmissao + '</span></div>' +
    '<div style="font-size:13.5px;color:var(--muted)">' + t.semanaAtual.resumo + '</div>' +
    '<div class="btn-row"><button>Submeter relatório semanal</button>' +
    '<a class="btn" href="12_-_Teletrabalho_-_Relatorio_Semanal.html">Visualizar relatório semanal</a></div>';

  var CHIP_PRIORIDADE = { red: "chip-red", amber: "chip-amber", gray: "chip-gray" };
  entregasEl.innerHTML = t.entregas.map(function (ent, ei) {
    var atividades = ent.atividades.map(function (a, ai) {
      var qtdRealizada = a.qtdRealizada
        ? '<span class="v">' + a.qtdRealizada + '</span>'
        : '<input type="text" placeholder="' + a.qtdRealizadaPlaceholder + '" size="5"> <span class="calc">' + a.unidadeQtd + '</span>';
      var evidencia;
      if (a.evidencia) evidencia = '<span class="v">' + a.evidencia + '</span>';
      else if (a.evidenciaLink) evidencia = '<span class="v"><a class="btn sm" href="11_-_Teletrabalho_-_Registro_de_Evidencia.html">Registrar evidência</a></span>';
      else evidencia = '<span class="v"><button class="sm">Registrar evidência</button></span>';
      var statusClass = a.statusChip === "Concluída" ? "st-done" : "st-warn";
      return '<div class="acc' + (ei === 0 && ai < 2 ? '' : ' col') + '"><button class="acc-h"><div class="acc-h-in">' +
        '<span class="acc-name"><span class="chev">▾</span>' + a.nome + '</span>' +
        '<span class="' + statusClass + '">' + a.statusChip + '</span></div></button>' +
        '<div class="acc-b">' +
        '<div class="kv"><span class="k">Tipo de atividade:</span><span class="v">' + a.tipoAtividade + '</span></div>' +
        '<div class="kv"><span class="k">Impacto:</span><span class="v">' + a.impacto + '</span></div>' +
        '<div class="kv"><span class="k">Dificuldade:</span><span class="v">' + a.dificuldade + '</span></div>' +
        '<div class="kv"><span class="k">Nível de complexidade:</span><span class="v">' + a.nivelComplexidade + '</span></div>' +
        '<div class="kv"><span class="k">Início pactuado:</span><span class="v">' + a.inicioPactuado + '</span></div>' +
        '<div class="kv"><span class="k">Conclusão pactuada:</span><span class="v">' + a.conclusaoPactuada + '</span></div>' +
        '<div class="kv"><span class="k">Conclusão realizada:</span><span class="v">' + (a.conclusaoRealizada || "") + '</span></div>' +
        '<div class="kv"><span class="k">Quantidade pactuada:</span><span class="v">' + a.qtdPactuada + '</span></div>' +
        '<div class="kv"><span class="k">Quantidade realizada:</span>' + qtdRealizada + '</div>' +
        '<div class="kv"><span class="k">Evidência:</span>' + evidencia + '</div>' +
        (a.log ? '<div class="log">' + a.log + '</div>' : '') +
        '</div></div>';
    }).join("");
    return '<div class="ent' + (ei > 0 ? ' col' : '') + '"><button class="ent-h"><div class="ent-h-in"><div>' +
      '<div class="ent-name"><span class="chev">▾</span>' + ent.nome + '</div>' +
      '<div class="ent-meta">' + ent.meta + '</div></div>' +
      '<span class="chip ' + CHIP_PRIORIDADE[ent.chipClasse] + '">' + ent.prioridadeChip + '</span></div></button>' +
      '<div class="ent-b">' + atividades + '</div></div>';
  }).join("");
})();
</script>
<script>PromoveNav.init({ atual: "04", raiz: "" });</script>
</body>
</html>
